<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Quayside — Home (concept demo)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <button class="top-icon only-mobile" id="menuBtn" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <a class="brand" href="/" aria-label="Quayside home">
      <svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#1C1606"/><path d="M6 17c2.7-3.6 5.3-3.6 8 0s5.3 3.6 8 0" fill="none" stroke="#FFC62E" stroke-width="2.2" stroke-linecap="round"/><circle cx="20" cy="9" r="2" fill="#fff"/></svg>
    </a>
    <button class="refer" id="referBtn" data-track="refer">
      <span class="refer__icon" aria-hidden="true">€</span>Refer &amp; earn up to €200
    </button>
    <div class="sale-wrap">
      <svg class="deco deco--l" viewBox="0 0 190 60" aria-hidden="true">
        <path d="M14 14l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fff"/>
        <circle cx="34" cy="46" r="2.5" fill="#1C1606"/><rect x="170" y="10" width="6" height="6" rx="1.5" fill="#fff" transform="rotate(20 173 13)"/>
        <circle cx="182" cy="44" r="2" fill="#1C1606"/>
        <g transform="translate(46 10) rotate(-14 40 20)">
          <path d="M38 2C24 -4 14 6 10 14" fill="none" stroke="#1C1606" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M0 18L14 6h60a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6H14z" fill="#fff" stroke="#1C1606" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="13" cy="22" r="3.2" fill="#FFC62E" stroke="#1C1606" stroke-width="1.6"/>
          <text x="22" y="28" font-family="Geist, system-ui, sans-serif" font-size="15" font-weight="800" fill="#1C1606">−50%</text>
        </g>
        <g transform="translate(150 30)">
          <circle r="13" fill="#E8A400" stroke="#1C1606" stroke-width="2"/>
          <circle r="8.5" fill="none" stroke="#1C1606" stroke-opacity=".35" stroke-width="1.5"/>
          <text y="4.5" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="800" fill="#1C1606">€</text>
        </g>
      </svg>
      <svg class="deco deco--r" viewBox="0 0 190 60" aria-hidden="true">
        <circle cx="10" cy="14" r="2.2" fill="#1C1606"/><rect x="20" y="42" width="6" height="6" rx="1.5" fill="#fff" transform="rotate(-18 23 45)"/>
        <g transform="translate(36 12) rotate(8 26 20)">
          <rect x="2" y="16" width="48" height="28" rx="4" fill="#1C1606"/>
          <rect x="0" y="9" width="52" height="10" rx="3" fill="#1C1606" stroke="#FFC62E" stroke-width="1.5"/>
          <rect x="22" y="9" width="8" height="35" fill="#fff"/>
          <path d="M26 9c-6-9-16-7-13 0zM26 9c6-9 16-7 13 0z" fill="#fff" stroke="#1C1606" stroke-width="1.6" stroke-linejoin="round"/>
        </g>
        <g transform="translate(118 18)">
          <ellipse cx="18" cy="30" rx="16" ry="5.5" fill="#C98A00" stroke="#1C1606" stroke-width="1.8"/>
          <ellipse cx="18" cy="24" rx="16" ry="5.5" fill="#E8A400" stroke="#1C1606" stroke-width="1.8"/>
          <ellipse cx="18" cy="18" rx="16" ry="5.5" fill="#FFD45C" stroke="#1C1606" stroke-width="1.8"/>
          <circle cx="44" cy="6" r="11" fill="#E8A400" stroke="#1C1606" stroke-width="2"/>
          <text x="44" y="10.5" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="800" fill="#1C1606">%</text>
        </g>
        <path d="M176 36l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#fff"/>
      </svg>
      <button class="sale" id="saleBtn" data-track="sale-banner">
        <strong>SALE!</strong> <span class="sale__label">Grab the best deals in:</span> <span class="sale__time" id="countdown">--D:--H:--M</span>
        <span class="sale__go" aria-hidden="true">→</span>
      </button>
    </div>
    <div class="top-right">
      <div class="demo-pill" title="Concept demo with made-up data">
        <span class="demo-pill__tag">Demo</span>
        <label for="personaSel" class="sr-only">Demo customer</label>
        <select id="personaSel"></select>
        <button id="resetBtn" class="demo-pill__reset" title="Reset the demo account">Reset</button>
      </div>
      <button class="agent-btn" id="agentBtn" data-track="top-agent">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
        Assistant
      </button>
      <button class="top-icon" id="bellBtn" aria-label="Notifications" data-track="bell">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg>
        <span class="badge" id="bellCount" hidden></span>
      </button>
      <span class="avatar" id="avatar" aria-hidden="true"></span>
    </div>
  </header>

  <div class="body">
    <nav class="side" id="side" aria-label="Main">
      <a class="nav is-active" href="/"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
      <button class="nav" data-focus-agent><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Assistant</button>
      <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>Websites</button>
      <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Domains</button>
      <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Emails</button>
      <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v13H4zM8 7V4h8v3"/></svg>More services</button>

      <p class="nav-group">Quayside apps</p>
      <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20 15 9M14 4v3M18.5 5.5l-2 2M20 10h-3"/></svg>AI Builder</button>
      <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Online store</button>

      <p class="nav-group">AI agents</p>
      <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 14h.01M15 14h.01"/></svg>Personal agent</button>
      <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 12h3l4-5M11.5 12l4 5"/></svg>Workflows (n8n)</button>

      <p class="nav-group">Marketing</p>
      <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1zM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></svg>Email marketing</button>
      <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Ads</button>

      <p class="nav-group">Dev tools</p>
      <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>VPS</button>
      <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg><span style="flex:1">GPU</span><span class="pill info plain">Beta</span></button>
      <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg>API</button>
    </nav>
    <button class="scrim" id="scrim" aria-label="Close menu" hidden></button>

    <main class="main" id="main">
      <div class="wrap">
        <!-- Greeting + assistant -->
        <section class="hero" aria-label="Assistant">
          <h1 id="greeting">Hi! How can I help you today?</h1>
          <form class="ask" id="askForm">
            <span class="ask__icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16v4M17 18h4"/></svg></span>
            <label for="askInput" class="sr-only">Ask the assistant</label>
            <textarea id="askInput" rows="1" maxlength="1000" placeholder="Ask about your sites or billing…"></textarea>
            <button class="send" id="sendBtn" type="submit" aria-label="Send">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </form>
          <div class="chips" id="chips"></div>
          <p class="hero__meta" id="agentInfo"></p>
        </section>

        <section class="card chatbox" id="chatbox" hidden aria-label="Conversation">
          <div class="chatbox__head"><strong>Assistant</strong><button class="link small" id="clearChat">Clear</button></div>
          <div class="chat" id="chat"></div>
        </section>

        <!-- Promo carousel -->
        <section class="promo-wrap" id="promoWrap" aria-roledescription="carousel" aria-label="Deals">
          <div class="promo" id="promo"></div>
          <div class="promo-nav">
            <button class="round-btn" id="promoPrev" aria-label="Previous deal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
            <div class="dots" id="promoDots"></div>
            <button class="round-btn" id="promoNext" aria-label="Next deal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
          </div>
        </section>

        <!-- To-dos -->
        <section aria-labelledby="todoTitle">
          <h2 class="sec-title" id="todoTitle">Your to-dos <span class="count" id="todoCount"></span></h2>
          <div class="card todos" id="todos"></div>
        </section>

        <!-- Business -->
        <section aria-labelledby="bizTitle">
          <h2 class="sec-title" id="bizTitle">Your business</h2>
          <div class="stack" id="sites"></div>
        </section>

        <div class="duo">
          <section class="card pad" aria-labelledby="planTitle">
            <h2 class="card-title" id="planTitle">Plan &amp; usage</h2>
            <div id="plan"></div>
          </section>
          <section class="card pad" aria-labelledby="renewTitle">
            <h2 class="card-title" id="renewTitle">Renewals</h2>
            <div id="renewals"></div>
            <div id="activityWrap" hidden>
              <h2 class="card-title" style="margin-top:18px">Done in this session</h2>
              <ul id="activity" class="activity"></ul>
            </div>
          </section>
        </div>

        <p class="footnote">Concept demo of a redesigned hosting control panel. Made-up account and prices; nothing is sold or charged.</p>
      </div>
    </main>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
