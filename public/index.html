<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Quayside — Home (concept demo)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="top">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <a class="brand" href="/" aria-label="Quayside home">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#101828"/><path d="M6 17c2.7-3.6 5.3-3.6 8 0s5.3 3.6 8 0" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="20" cy="9" r="2" fill="#7D93F2"/></svg>
        <span>Quayside</span>
      </a>
      <button class="cmd" id="cmdBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Ask the assistant or search…</span>
      </button>
      <div class="top-right">
        <div class="demo-pill" title="This is a concept demo with made-up data">
          <span class="demo-pill__tag">Concept demo</span>
          <label for="personaSel" class="sr-only">Demo customer</label>
          <select id="personaSel"></select>
          <button id="resetBtn" class="demo-pill__reset" title="Reset the demo account">Reset</button>
        </div>
        <button class="icon-btn" id="bellBtn" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg>
          <span class="badge" id="bellCount" hidden></span>
        </button>
        <span class="avatar" id="avatar" aria-hidden="true"></span>
      </div>
    </header>

    <div class="body">
      <nav class="side" id="side" aria-label="Main">
        <a class="nav is-active" href="/"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
        <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>Websites</button>
        <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Domains</button>
        <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Email</button>
        <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>Servers</button>
        <p class="nav-group">Grow</p>
        <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1zM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></svg>Marketing</button>
        <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 14h.01M15 14h.01"/></svg>AI agents</button>
        <p class="nav-group">Account</p>
        <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/></svg>Billing</button>
        <button class="nav" data-demo><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg>Help</button>
      </nav>
      <button class="scrim" id="scrim" aria-label="Close menu" hidden></button>

      <main class="main" id="main">
        <div class="wrap">
          <section class="greet">
            <div>
              <h1 id="greeting">Welcome back</h1>
              <p id="summary" class="muted"></p>
            </div>
          </section>

          <!-- Assistant -->
          <section class="card agent" aria-label="Assistant">
            <div class="agent__head">
              <span class="agent__icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16v4M17 18h4"/></svg>
              </span>
              <div>
                <h2>Assistant</h2>
                <p class="muted small" id="agentInfo">Knows your account, prices and limits</p>
              </div>
              <button class="link small" id="clearChat" hidden>Clear</button>
            </div>
            <div class="chat" id="chat" hidden></div>
            <form class="ask" id="askForm">
              <label for="askInput" class="sr-only">Ask the assistant</label>
              <textarea id="askInput" rows="1" maxlength="1000" placeholder="Ask about your websites, plan or billing…"></textarea>
              <button class="send" id="sendBtn" type="submit" aria-label="Send">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              </button>
            </form>
            <div class="chips" id="chips"></div>
          </section>

          <!-- Next best actions -->
          <section aria-labelledby="nbaTitle">
            <div class="sec-head">
              <h2 id="nbaTitle">Recommended for you</h2>
              <button class="link small" id="nbaMore" hidden></button>
            </div>
            <div class="nba" id="nba"></div>
          </section>

          <div class="cols">
            <div class="col-main">
              <section aria-labelledby="sitesTitle">
                <div class="sec-head"><h2 id="sitesTitle">Websites</h2></div>
                <div id="sites" class="stack"></div>
              </section>
            </div>
            <aside class="col-side">
              <section class="card pad" aria-labelledby="planTitle">
                <div class="sec-head tight"><h2 id="planTitle">Plan &amp; usage</h2></div>
                <div id="plan"></div>
              </section>
              <section class="card pad" aria-labelledby="renewTitle">
                <div class="sec-head tight"><h2 id="renewTitle">Renewals</h2></div>
                <div id="renewals"></div>
              </section>
              <section class="card pad" aria-labelledby="actTitle" id="activityCard" hidden>
                <div class="sec-head tight"><h2 id="actTitle">Done in this session</h2></div>
                <ul id="activity" class="activity"></ul>
              </section>
            </aside>
          </div>

          <p class="footnote">Concept demo of a redesigned hosting control panel. Made-up account and prices; nothing is charged.</p>
        </div>
      </main>
    </div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
